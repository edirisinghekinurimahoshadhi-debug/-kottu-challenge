<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Midnight Cheese Kottu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ලාම්පු එළිය (Cozy Lamp) -->
    <div class="lamp-container">
        <div class="lamp"></div>
        <div class="light-beam"></div>
    </div>

    <!-- ජනේලය, හඳ සහ නිවී නිවී පෙනෙන තරු 3 (Window, Moon & Stars) -->
    <div class="window">
        <div class="window-frame"></div>
        <div class="moon"></div>
        <div class="star s1"></div>
        <div class="star s2"></div>
        <div class="star s3"></div>
    </div>

    <div class="main-content">
        <p class="subtitle">A WARM BOWL FOR A QUIET NIGHT</p>
        <h1 class="title">Spicy 🧀 Kottu</h1>
        <p class="sinhala-sub">Spicy Taste</p>

        <!-- පාවෙන සහ දුම් දමන කොත්තු කෝප්පය (Floating Kottu Bowl) -->
        <div class="bowl-wrapper">
            <!-- සැබෑම CSS දුම් රේඛා 3 (Real CSS Steam) -->
            <div class="steam-container">
                <span class="steam-line line1"></span>
                <span class="steam-line line2"></span>
                <span class="steam-line line3"></span>
            </div>
            
            <div class="kottu-bowl">
                <div class="cheese-melt"></div>
                <div class="food-details">🧀</div>
                
                <!-- චොප්ස්ටික්ස් (Chopsticks) -->
                <div class="chopstick c1"></div>
                <div class="chopstick c2"></div>
            </div>
        </div>

        <!-- Portion Calculator Card -->
        <div class="calculator-card">
            <h3>Cheese Kottu Calculator</h3>
            <div class="input-group">
                <label for="servings">Servings: </label>
                <input type="number" id="servings" value="1" min="1" max="10">
            </div>
            <ul class="ingredients-list">
                <li><span id="roti">2</span> Parotta Roti sheets</li>
                <li><span id="cheese">50</span>g of Mozzarella Cheese</li>
                <li><span id="chicken">100</span>g of Devilled Chicken</li>
                <li><span id="eggs">1</span> Fresh Egg</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
