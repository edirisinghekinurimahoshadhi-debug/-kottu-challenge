<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Midnight Kottu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ලාම්පු එළිය (Lamp Light effect) -->
    <div class="lamp-container">
        <div class="lamp"></div>
        <div class="light-beam"></div>
    </div>

    <!-- වම් පැත්තේ ජනේලය සහ හඳ (Window & Moon) -->
    <div class="window">
        <div class="moon"></div>
        <div class="stars"></div>
    </div>

    <div class="main-content">
        <p class="subtitle">A WARM BOWL FOR A QUIET NIGHT</p>
        <h1 class="title">Spicy 🧀 Kottu</h1>
        <p class="sinhala-sub">Spicy Taste</p>
            <p class="Sri Lankan Tasty Kottu"</p>

       <div class="bowl-wrapper">
    <!-- දුම් දමන ඇනිමේෂන් එක -->
    <div class="steam-container">
        <span class="steam-line line1"></span>
        <span class="steam-line line2"></span>
        <span class="steam-line line3"></span>
    </div>
    
    <div class="kottu-bowl">
        <div class="cheese-melt"></div>
        <!-- ඔයා දාපු ලස්සන 🧀 ඉමෝජි එක මැදට එන්න -->
        <div class="food-details" style="font-size: 2.2rem; margin-top: 10px;">🧀</div>
        
        <div class="chopstick c1"></div>
        <div class="chopstick c2"></div>
    </div>
</div>

        </div>

        <!-- Calculator Section -->
        <div class="calculator-card">
            <h3>Portion Calculator</h3>
            <div class="input-group">
                <label for="servings">Servings: </label>
                <input type="number" id="servings" value="1" min="1" max="10">
            </div>
            <ul class="ingredients-list">
                <li><span id="roti">2</span> Parotta Roti</li>
                <li><span id="cheese">50</span>g Melted Cheese</li>
                <li><span id="chicken">100</span>g Spicy Chicken</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
