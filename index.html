<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cozy Midnight Kottu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ලාම්පු එළිය (Lamp Light effect) -->
    <div class="lamp-container">
        <div class="lamp"></div>
        <div class="light-beam"></div>
    </div>

    <!-- වම් පැත්තේ ජනේලය සහ හඳ (Window & Moon) -->
    <div class="window">
        <div class="moon"></div>
        <div class="stars"></div>
    </div>

    <div class="main-content">
        <p class="subtitle">A WARM BOWL FOR A QUIET NIGHT</p>
        <h1 class="title">Cozy Kottu</h1>
        <p class="sinhala-sub">හිත නිවන රෑ කෑමක්</p>

        <!-- Kottu Bowl Card -->
        <div class="bowl-container">
            <div class="steam">♨️</div>
            <div class="kottu-bowl">
                <span class="cheese-layer">🧀🧀🧀</span>
                <span class="ingredients">🍜🍗🥚</span>
            </div>
        </div>

        <!-- Calculator Section -->
        <div class="calculator-card">
            <h3>Portion Calculator</h3>
            <div class="input-group">
                <label for="servings">Servings: </label>
                <input type="number" id="servings" value="1" min="1" max="10">
            </div>
            <ul class="ingredients-list">
                <li><span id="roti">2</span> Parotta Roti</li>
                <li><span id="cheese">50</span>g Melted Cheese</li>
                <li><span id="chicken">100</span>g Spicy Chicken</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
